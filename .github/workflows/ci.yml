name: CI

on:
  push:
    branches: [main, "story/**"]
  pull_request:

jobs:
  # lint + typecheck + unit tests, deliberately WITHOUT the e2e package.
  # Unit tests must not sit behind the playwright install or the e2e run:
  # before this split, all of it lived in one `pnpm test` step at the end
  # of a single job, so e2e's failure (see the `e2e` job below) meant the
  # unit suite's own red/green was never independently visible in CI.
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm turbo run test --filter='!@ai-km/e2e'

  contract-gate:
    # Deliberately its own job, independent of the others: this checks
    # exactly one thing (an error inside a *-compat.ts file — see
    # contracts/openapi/__checks__/run-gate.mjs), so its red must never be
    # confused with a lint/typecheck/unit-test failure or with e2e's
    # pre-existing, unrelated failure below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm contract-gate

  e2e:
    # Deliberately its own job, independent of the others: as of
    # 2026-08-28 this job is RED on main (`@ai-km/e2e#test` failing,
    # historically `connect ECONNREFUSED 127.0.0.1:4000`) — a pre-existing
    # regression tracked separately, not something either of the other two
    # jobs' green should be able to hide, and not something this job's red
    # should get to hide either.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @ai-km/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          # E04-S068: tests/e2e/helpers/lock-guard.ts's DEFAULT_LOCK_FILE_PATH
          # / DEFAULT_OWNER_FILE_PATH are hardcoded dev-machine paths under
          # /data/python/AI_KM-worktrees/, which do not exist on a GitHub
          # runner. Point both at a runner-local path instead. This is
          # configuration only — zero change to the guard's block/proceed
          # decision logic; that configurability is exactly what it's for.
          # AI_KM_E2E_LOCK_FILE is the block/proceed authority (must point
          # at a writable path whose parent dir exists, so flock reports
          # "free" instead of "unusable"). AI_KM_E2E_OWNER_FILE is read
          # only for the thrown error's human-readable label, never for
          # the decision, but is set here too so a CI run never even
          # attempts to read the nonexistent dev-machine path.
          # NOTE: this env block is deliberately on the STEP, not the job
          # -- the `runner` context is only available at step scope
          # (jobs.<id>.steps[*].env), not at jobs.<id>.env. Putting it at
          # job level makes the whole workflow file fail to parse, with
          # no job ever created and no readable error beyond GitHub's
          # generic "This run likely failed because of a workflow file
          # issue." (confirmed live: runs 33586338481 and 33586437616).
          AI_KM_E2E_LOCK_FILE: ${{ runner.temp }}/.e2e.lock
          AI_KM_E2E_OWNER_FILE: ${{ runner.temp }}/.e2e.owner

  accept:
    # Deliberately its own job (PITFALLS 坑 4: one job per independent
    # property, so one class of red never hides another). This job checks
    # exactly one thing the other three do not: that the Gherkin
    # specification actually EXECUTES. lint-typecheck-unit runs
    # @ai-km/features:test, which is the three static scanners
    # (gherkin:dup, steps:dup, doc-links) -- none of them runs a scenario.
    #
    # accept:coverage is the reason this job cannot be replaced by
    # `pnpm accept:phase1` alone: cucumber exits 0 on `0 scenarios`, so a
    # capability folder whose feature-file tag is misspelled -- or that
    # cucumber.js's paths glob never reaches -- keeps accept:phase1 fully
    # green while contributing nothing. Verified live on 2026-09-04 by
    # mutating 06-retrieval/phase-1.feature's first line to @retrievel:
    # accept:phase1 still printed "9 scenarios (9 passed)"; accept:coverage
    # went red with "phase-1.feature 存在,但用它自己的 tag 「@retrieval」
    # 選到 0 個場景". This matters most during the 11 parallel phase-1
    # backfills, where no worker can see the other ten's tags.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every capability folder that has a phase-1.feature contributes at
      # least one passing scenario when selected by its own tag.
      - run: pnpm accept:coverage

      # All phase-1 scenarios together -- this is where a cross-folder
      # duplicate/ambiguous step definition surfaces as a real failure.
      - run: pnpm accept:phase1

      # The integration points already accepted (I1). Deliberately NOT a
      # bare `pnpm accept`: that also collects the not-yet-written
      # integration points (I2..) and reports their undefined steps, which
      # is "not built yet", not "broken" -- GHERKIN_WORKFLOW §7.6.
      - run: pnpm accept:integration

      # Import-boundary gate (scripts/boundaries.owners.json +
      # scripts/boundaries.allow.json at the repo root, consumed by
      # features/scripts/check-boundaries.ts). It already runs inside
      # `@ai-km/features`'s own `test` script via `pnpm turbo run test` in
      # lint-typecheck-unit above, alongside gherkin:dup/steps:dup/
      # docs:links -- this line just gives it its own visible line here
      # too, same one-job-one-property spirit as accept:coverage.
      - run: pnpm --filter @ai-km/features boundaries

  # This workflow covers the L0 gate (lint/typecheck/unit test), the
  # contract gate, E2E, and the Gherkin acceptance run as four
  # independently-readable jobs.
  # Integration and security-negative gates are added per-story as real
  # services/tests land — see
  # archive/AI_KM_BMAD_High_Granularity/policies/TESTING_POLICY.md.
