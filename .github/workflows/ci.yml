name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # This workflow covers the L0 gate (build/lint/typecheck/test) only.
      # Contract, integration, security-negative, and E2E gates are added
      # per-story as real services/tests land — see
      # AI_KM_BMAD_High_Granularity/policies/TESTING_POLICY.md.
