name: CI

on:
  push:
    branches: [main, "story/**"]
  pull_request:

jobs:
  # lint + typecheck + unit tests, deliberately WITHOUT the e2e package.
  # Unit tests must not sit behind the playwright install or the e2e run:
  # before this split, all of it lived in one `pnpm test` step at the end
  # of a single job, so e2e's failure (see the `e2e` job below) meant the
  # unit suite's own red/green was never independently visible in CI.
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm turbo run test --filter='!@ai-km/e2e'

  contract-gate:
    # Deliberately its own job, independent of the others: this checks
    # exactly one thing (an error inside a *-compat.ts file — see
    # contracts/openapi/__checks__/run-gate.mjs), so its red must never be
    # confused with a lint/typecheck/unit-test failure or with e2e's
    # pre-existing, unrelated failure below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm contract-gate

  e2e:
    # Deliberately its own job, independent of the others: as of
    # 2026-08-28 this job is RED on main (`@ai-km/e2e#test` failing,
    # historically `connect ECONNREFUSED 127.0.0.1:4000`) — a pre-existing
    # regression tracked separately, not something either of the other two
    # jobs' green should be able to hide, and not something this job's red
    # should get to hide either.
    runs-on: ubuntu-latest
    env:
      # E04-S068: tests/e2e/helpers/lock-guard.ts's DEFAULT_LOCK_FILE_PATH
      # / DEFAULT_OWNER_FILE_PATH are hardcoded dev-machine paths under
      # /data/python/AI_KM-worktrees/, which do not exist on a GitHub
      # runner. Point both at a runner-local path instead. This is
      # configuration only — zero change to the guard's block/proceed
      # decision logic; that configurability is exactly what it's for.
      # AI_KM_E2E_LOCK_FILE is the block/proceed authority (must point at
      # a writable path whose parent dir exists, so flock reports "free"
      # instead of "unusable"). AI_KM_E2E_OWNER_FILE is read only for the
      # thrown error's human-readable label, never for the decision, but
      # is set here too so a CI run never even attempts to read the
      # nonexistent dev-machine path.
      AI_KM_E2E_LOCK_FILE: ${{ runner.temp }}/.e2e.lock
      AI_KM_E2E_OWNER_FILE: ${{ runner.temp }}/.e2e.owner
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @ai-km/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # This workflow covers the L0 gate (lint/typecheck/unit test), the
  # contract gate, and E2E as three independently-readable jobs.
  # Integration and security-negative gates are added per-story as real
  # services/tests land — see
  # AI_KM_BMAD_High_Granularity/policies/TESTING_POLICY.md.
