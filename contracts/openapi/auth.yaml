openapi: 3.1.0
info:
  title: AI KM Authentication Contracts
  version: 1.0.0
  description: >
    The minimum identity slice that conversation persistence and cross-window
    sync depend on: a session that survives a new tab and a hard reload.


    Authored under E02-S031 (user-assigned to Team A on 2026-08-28; the E02
    domain belongs to Team B, so changes here need domain-owner review).
    Design fixed by `docs/adr/0005-session-cookie-auth-and-test-sandbox.md`.


    This is the frozen slice of **E02-S009** ("local authentication
    endpoint"), not a parallel mechanism. E02's later stories (OIDC, LDAP,
    RBAC evaluation, password reset) extend this; they do not replace it, and
    nothing here should be re-litigated when they land.


    The shapes are not invented: `AuthSession` is field-for-field the
    interface `@ai-km/auth-client` has exposed since E01, and the domain error
    codes are exactly its `AuthErrorCode` union.


    **Token handling.** The session token lives in an HttpOnly cookie and
    NOWHERE else. It never appears in a response body, never in a URL, and
    client code cannot read it. The server stores only a SHA-256 of the token,
    so a database disclosure does not yield usable sessions.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
  contact:
    name: E02 domain owner (Team B) / authored by Team A under E02-S031
servers:
  - url: /v1
    description: >
      Same-origin path prefix; apps/web rewrites `/api/v1/*` here
      (ADR 0003 §6).

tags:
  - name: auth
    description: Session lifecycle.

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a session cookie.
      description: >
        On success the server sets `ai_km_session` as an **HttpOnly** cookie
        with `SameSite=Lax` and `Path=/`, adding `Secure` whenever the request
        arrived over HTTPS. The response body carries the session's
        描述 fields only — it never carries the token itself, so no client
        script can read, log or forward it.


        `SameSite=Lax` is the deliberate choice over `Strict`: `Strict` would
        drop the cookie on a top-level navigation into the app from an
        internal wiki or email link, logging the user out for no security
        gain that matters here. Cross-site *writes* are additionally defended
        by the custom-header requirement in E04-S048.


        Failures are distinguished by machine-readable code, never by message:
        `INVALID_CREDENTIALS` (401) is returned for both an unknown username
        and a wrong password, so the endpoint cannot be used to enumerate
        accounts, while `ACCOUNT_DISABLED` (403) is a deliberate exception —
        a user whose account was turned off needs to know to contact an
        administrator rather than keep retrying a password that is correct.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set on this response.
          headers:
            Set-Cookie:
              description: >
                `ai_km_session=<opaque>; HttpOnly; SameSite=Lax; Path=/`
                plus `; Secure` over HTTPS. The value is a 256-bit random
                token; only its SHA-256 is stored server-side.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccountDisabled"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session.
      description: >
        Deletes the session server-side and clears the cookie.


        **Idempotent**: logging out with no session, or with an expired or
        already-deleted one, is still 204. Signing out is the user asking to
        end up signed out; reporting an error for "you were already signed
        out" would give a client something to handle that has no useful
        handling, and would leak whether a token was still valid.
      security:
        - sessionCookie: []
        - {}
      responses:
        "204":
          description: >
            Signed out. No body. The response clears `ai_km_session`.
          headers:
            Set-Cookie:
              description: >
                `ai_km_session=; Max-Age=0; HttpOnly; SameSite=Lax; Path=/`
                (plus `; Secure` over HTTPS).
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The caller's current session.
      description: >
        Used on app load and after a reload to decide whether the user is
        signed in. Returns 401 `UNAUTHENTICATED` when there is no valid
        session; `@ai-km/auth-client` maps that to `ok: null` rather than an
        error, because "not signed in" is an expected state, not a failure.


        A valid call also refreshes the session's idle window (ADR 0005 §2:
        12-hour sliding `last_seen_at` within an absolute 7-day
        `expires_at`).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ai_km_session
      description: >
        Opaque 256-bit session token. HttpOnly, `SameSite=Lax`, `Path=/`, and
        `Secure` over HTTPS. The browser sends it automatically; client code
        never reads it and the server stores only its SHA-256.


        This scheme is the canonical definition for the whole API — other
        specs (`conversations.yaml`, `transcriptions.yaml`, `analytics.yaml`)
        describe the same cookie.

  schemas:
    LoginRequest:
      type: object
      description: >
        Credentials only. There is deliberately no field naming a user id,
        role or owner: identity is what the server DERIVES from these
        credentials, never what the caller asserts.
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          description: >
            Never logged, never echoed, never included in any error body or
            audit payload.
      examples:
        - username: demo-user
          password: demo-pass-123

    AuthSession:
      type: object
      description: >
        Field-for-field the `AuthSession` interface in
        `packages/auth-client/src/index.ts`. Carries no token — see the
        top-level description.
      required: [userId, roles, expiresAt]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Stable identity. Derived from the session, never from the request body.
        roles:
          type: array
          description: >
            Role names. Informational for the UI only — the client must never
            derive a permission the server has not already enforced. An empty
            array is valid and means "no roles", not "all roles".
          items:
            type: string
          uniqueItems: true
        expiresAt:
          type: string
          format: date-time
          description: >
            UTC ISO-8601 absolute expiry (7 days, ADR 0005 §2). The idle
            window is enforced server-side and is deliberately not exposed —
            a client must not try to predict its own logout.
        name:
          type: string
          description: >
            Profile display fields (E01-S010) are optional: a real E02-backed
            session may not populate them, and every session-shaped fixture
            written before they existed stays valid.
        email:
          type: string
        department:
          type: string
        group:
          type: string
      examples:
        - userId: demo-user
          roles: [general_user]
          expiresAt: 2026-09-04T05:12:00.000Z
          name: 示範使用者
          email: demo-user@example.com
          department: 工程部
          group: 平台組

    AuthErrorCode:
      type: string
      description: >
        Exactly the `AuthErrorCode` union in `@ai-km/auth-client`. Consumers
        branch on these; they must never branch on `message`.
      enum:
        - VALIDATION_ERROR
        - INVALID_CREDENTIALS
        - ACCOUNT_DISABLED
        - SERVICE_UNAVAILABLE
      examples: [INVALID_CREDENTIALS]

    ValidationErrorBody:
      allOf:
        - $ref: "./core.yaml#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
          required: [code]
      examples:
        - code: VALIDATION_ERROR
          message: 請輸入帳號與密碼。

    InvalidCredentialsBody:
      allOf:
        - $ref: "./core.yaml#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [INVALID_CREDENTIALS]
          required: [code]
      examples:
        - code: INVALID_CREDENTIALS
          message: 帳號或密碼不正確。

    AccountDisabledBody:
      allOf:
        - $ref: "./core.yaml#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [ACCOUNT_DISABLED]
          required: [code]
      examples:
        - code: ACCOUNT_DISABLED
          message: 此帳號已停用,請聯絡系統管理員。

    UnauthenticatedBody:
      allOf:
        - $ref: "./core.yaml#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED]
          required: [code]
      examples:
        - code: UNAUTHENTICATED
          message: 請先登入。

    UnsupportedMediaTypeBody:
      allOf:
        - $ref: "./core.yaml#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [UNSUPPORTED_MEDIA_TYPE]
          required: [code]
      examples:
        - code: UNSUPPORTED_MEDIA_TYPE
          message: 僅接受 application/json。

    ServiceUnavailableBody:
      allOf:
        - $ref: "./core.yaml#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [SERVICE_UNAVAILABLE]
          required: [code]
      examples:
        - code: SERVICE_UNAVAILABLE
          message: 認證服務暫時無法使用,請稍後再試。

    InternalErrorBody:
      allOf:
        - $ref: "./core.yaml#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [INTERNAL_ERROR]
          required: [code]
      examples:
        - code: INTERNAL_ERROR
          message: 系統發生未預期的錯誤。

  responses:
    ValidationError:
      description: Missing or malformed credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorBody"
    InvalidCredentials:
      description: >
        Unknown username OR wrong password — deliberately indistinguishable,
        so this endpoint cannot enumerate accounts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidCredentialsBody"
    AccountDisabled:
      description: >
        The credentials were correct but the account is disabled. Distinct
        from 401 on purpose: the user must know to contact an administrator
        instead of retrying a password that is already right.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountDisabledBody"
    Unauthenticated:
      description: >
        No valid session. Expected on first load — not an error condition for
        the client.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthenticatedBody"
    UnsupportedMediaType:
      description: Request body was not `application/json`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnsupportedMediaTypeBody"
    ServiceUnavailable:
      description: The identity backend could not be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceUnavailableBody"
    InternalError:
      description: Unexpected server error. Never contains a stack trace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorBody"
