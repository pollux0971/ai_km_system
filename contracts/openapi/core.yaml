openapi: 3.1.0
info:
  title: AI KM Core Contracts
  version: 0.0.0
  description: >
    Scaffold-only starter spec proving the Contract-First pipeline
    (contracts/openapi -> @ai-km/api-client codegen) resolves end-to-end.
    Real endpoints must be negotiated with Team B before being added here —
    per policies/ATOMIC_STORY_BOUNDARIES.md, never invent an endpoint/schema
    that hasn't been agreed with the owning domain.
paths: {}
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Stable, machine-readable failure code. Deliberately free-form
            (not an enum) — each domain spec defines and documents its own
            codes; turning this into a shared enum would make every new
            domain code a breaking change here. Platform-wide codes used
            across every domain (not specific to one spec's own endpoints)
            are documented here for discoverability:

            `CSRF_HEADER_MISSING` (403) — E04-S048, ADR 0005 addendum.
            A state-changing (POST/PUT/PATCH/DELETE) request was missing the
            `x-requested-with` header, or — for `multipart/form-data`
            requests specifically — had no `Origin`/`Referer` matching the
            configured allowlist. Returned instead of a domain-specific code
            so the check can sit in front of every domain uniformly. Never
            distinguishable from a session-related 401/403 by response
            shape alone; only the `code` differs.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
