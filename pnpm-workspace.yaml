packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "tests/*"
  - "tools/*"
  # E04-S070: `tools/mutate.mjs` + `tools/mutate.test.ts` sit directly under
  # `tools/`, not a `tools/<name>/` subdirectory (the story specifies those
  # exact literal paths) — `tools/*` only globs tools' immediate children
  # (tools/asr-readiness, tools/w1-00-demo), never the `tools/` directory
  # itself, so `tools` is listed here as its own literal workspace package
  # too. Nesting is intentional and does not conflict: pnpm/turbo key each
  # workspace package purely off where its own `package.json` sits.
  - "tools"
  # ADR 0008: `features/` is the cucumber runner + step definitions for the
  # staged-Gherkin paradigm (one folder per capability, one .feature per
  # phase). Its own package so @cucumber/cucumber + tsx are pinned in one
  # place and `pnpm --filter @ai-km/features accept` is the single entry point.
  - "features"
allowBuilds:
  # esbuild's install script only downloads the platform-specific binary
  # (needed transitively by vitest/vite, added in E01-S001) — no arbitrary
  # code execution beyond that, so it's safe to allow like the deps below.
  esbuild: true
  sharp: true
  unrs-resolver: true
  # better-sqlite3's install script runs prebuild-install, which downloads the
  # prebuilt native binary for this platform/Node ABI (Node 22) and only falls
  # back to node-gyp when none exists — the same "fetch a platform binary, no
  # arbitrary code" shape as esbuild above. Added by E04-S040 (apps/api's
  # SQLite persistence, ADR 0003 §2).
  better-sqlite3: true
patchedDependencies:
  '@material/material-color-utilities@0.4.0': patches/@material__material-color-utilities@0.4.0.patch
overrides:
  # E06-S008: pdfjs-dist lists @napi-rs/canvas (a ~33MB native binary) as an
  # optionalDependency for its Node.js canvas-rendering path. services/ingestion
  # only extracts text (no rendering, no canvas), and Pure JS is a stated
  # project requirement. `-` is pnpm's documented override value to delete a
  # dependency from the resolved tree entirely (not merely skip installing
  # it) — a plain packageExtensions override only ADDS/REPLACES fields and
  # cannot remove a single key from an existing optionalDependencies map, so
  # it left @napi-rs/canvas resolved even when pointed at `false`. Baseline
  # before E06-S008: @napi-rs/canvas appeared zero times in the lockfile;
  # `pnpm why @napi-rs/canvas` must report zero matches after this. Text
  # extraction is proven to still work without it by services/ingestion's
  # pdf-extract tests (they run against this same install).
  '@napi-rs/canvas': '-'
